<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace">
<title>PN-08 field-ops-sql-cost-audit architecture</title>
<desc>Blueprint: messy operational tables flow into dbt staging views, then a business-logic CTE layer, then tested reporting views, then Tableau dashboards. dbt tests and a GitHub Actions gate validate the reporting views.</desc>
<defs>
<pattern id="gm" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#EAF3FB" stroke-opacity="0.05" stroke-width="1"/></pattern>
<pattern id="gM" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#EAF3FB" stroke-opacity="0.09" stroke-width="1"/></pattern>
<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9FDBFF"/></marker>
<marker id="ad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#EAF3FB" fill-opacity="0.8"/></marker>
<style>
text{font-size:9px;letter-spacing:0.06em;fill:#EAF3FB;text-transform:uppercase}
.c{text-anchor:middle}
.s{fill-opacity:0.7}
.h{font-size:10px}
.a{fill:#9FDBFF}
.b{fill:none;stroke:#EAF3FB;stroke-opacity:0.7;stroke-width:1}
.k{fill:none;stroke:#9FDBFF;stroke-width:1}
.d{stroke:#EAF3FB;stroke-opacity:0.5;stroke-width:1}
</style>
</defs>
