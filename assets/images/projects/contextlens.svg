<path class="ln" d="M320 122V140" marker-start="url(#ar)" marker-end="url(#ar)"/>
<path class="kp" d="M156 264H196" marker-end="url(#ac)"/>
<path class="kp" d="M336 264H376" marker-end="url(#ac)"/>
<path class="kp" d="M446 240V204H380V180" marker-end="url(#ac)"/>
<path class="kp" d="M412 160H468" marker-end="url(#ac)"/>
<path class="ln" d="M516 264H548" stroke-dasharray="3 2"/>

<text class="s" x="16" y="334">Local core answers offline; background sync fills the cache</text>
<line x1="470" y1="331" x2="494" y2="331" stroke="#9FDBFF" stroke-width="1"/>
<text class="a s" x="502" y="334" style="fill-opacity:1">Key path</text>
</svg>