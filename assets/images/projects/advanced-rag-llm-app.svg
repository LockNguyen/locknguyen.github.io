<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<title>PN-04 Advanced RAG LLM App</title>
<desc>Blueprint schematic: documents are ingested, chunked, embedded and stored in SQLite. A hybrid vector and BM25 retriever feeds a citation prompt builder and an LLM layer. A FastAPI API and UI serves answers with sources.</desc>
<defs>
<pattern id="g" width="80" height="80" patternUnits="userSpaceOnUse">
<path d="M16 0V80M32 0V80M48 0V80M64 0V80M0 16H80M0 32H80M0 48H80M0 64H80" fill="none" stroke="#EAF3FB" stroke-opacity="0.05" stroke-width="1"/>
<path d="M0 0V80M0 0H80" fill="none" stroke="#EAF3FB" stroke-opacity="0.09" stroke-width="1"/>
</pattern>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#EAF3FB" fill-opacity="0.8"/></marker>
<marker id="k" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9FDBFF"/></marker>
<style>
text{font-family:"IBM Plex Mono",SFMono-Regular,Consolas,monospace;font-size:9px;letter-spacing:0.06em;text-transform:uppercase;fill:#EAF3FB}
.t{font-size:10px}
.s{fill-opacity:0.7}
.m{text-anchor:middle}
.ac{fill:#9FDBFF}
.b{fill:#0D3B66;stroke:#EAF3FB;stroke-opacity:0.7;stroke-width:1}
.kb{fill:#0D3B66;stroke:#9FDBFF;stroke-width:1}
.l{stroke:#EAF3FB;stroke-opacity:0.8;stroke-width:1;fill:none}
.kl{stroke:#9FDBFF;stroke-width:1;fill:none}
</style>
</defs>
