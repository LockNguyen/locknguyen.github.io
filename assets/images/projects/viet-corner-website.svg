<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="ti de">
<title id="ti">PN-01 Viet Corner Website schematic</title>
<desc id="de">Next.js public site and admin dashboard share a Firestore database through real-time listeners. Firestore nests courses, locations and classes. A Firebase Auth admin check guards writes, Firebase Storage holds the image gallery, and an EN/VI translation context wraps both front ends.</desc>
