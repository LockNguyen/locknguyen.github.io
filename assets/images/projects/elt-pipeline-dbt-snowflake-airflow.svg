.k{fill:#9FDBFF}
.c{text-anchor:middle}
.s{fill:#0D3B66;stroke:#EAF3FB;stroke-opacity:.6;stroke-width:1}
.n{fill:none;stroke:#EAF3FB;stroke-opacity:.5;stroke-width:1}
.l{fill:none;stroke:#EAF3FB;stroke-opacity:.8;stroke-width:1}
.a{fill:none;stroke:#9FDBFF;stroke-width:1}
.d{stroke-dasharray:4 3}
</style>
<pattern id="g1" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#EAF3FB" stroke-opacity=".05" stroke-width="1"/></pattern>
<pattern id="g2" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#EAF3FB" stroke-opacity=".09" stroke-width="1"/></pattern>
