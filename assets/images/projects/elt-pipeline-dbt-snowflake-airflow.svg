<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<title>PN-09 ELT Pipeline: dbt + Snowflake + Airflow</title>
<desc>Blueprint schematic: three sources feed async Python extractors, then the Snowflake raw schema, then dbt staging, intermediate and marts with tests, then dashboards. Airflow orchestrates daily, GitHub Actions runs dbt tests on PRs, and Slack receives failure alerts.</desc>
